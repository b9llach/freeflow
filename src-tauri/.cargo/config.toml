# Build configuration for the native (cmake-driven) dependencies.
#
# The C runtime is deliberately left at the default dynamic CRT for both Rust
# and the C++ code. An earlier attempt to force the static CRT left the Rust
# side static while whisper.cpp's objects stayed dynamic (CMake ignores
# CMAKE_MSVC_RUNTIME_LIBRARY under whisper.cpp's old minimum-version policy),
# which broke linking of debug builds. The Visual C++ runtime DLLs the dynamic
# CRT needs are bundled next to freeflow2.exe by scripts/copy-runtime-dlls.cjs,
# so end users do not need the Redistributable installed.

[env]
# Point every cmake-driven sys crate (whisper-rs-sys, primarily) at our
# toolchain file. It caps whisper.cpp codegen at AVX2 so the shipped exe
# does not require AVX-512, which the dev machine has but many user machines
# do not (EXCEPTION_ILLEGAL_INSTRUCTION at model load).
CMAKE_TOOLCHAIN_FILE = { value = "toolchain-windows.cmake", relative = true }
# Pin the cmake generator. cmake-rs auto-detects the newest Visual Studio it
# finds, but if that release postdates the local cmake install (for example
# VS 18 / 2026 on cmake 3.29) cmake refuses the generator string and the
# build fails. VS 17 (2022) works everywhere.
CMAKE_GENERATOR = "Visual Studio 17 2022"
